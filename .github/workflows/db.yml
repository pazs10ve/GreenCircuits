name: db

on:
  push:
    branches: [main]
    paths: ["db/**", ".github/workflows/db.yml"]
  pull_request:
    paths: ["db/**", ".github/workflows/db.yml"]

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.1-pg17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply the schema and the Timescale layer
        run: psql -v ON_ERROR_STOP=1 -q -f db/schema.sql -f db/timescale.sql
      - name: Run the smoke checks
        run: psql -v ON_ERROR_STOP=1 -f db/tests/smoke.sql
